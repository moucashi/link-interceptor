[package]
name = "link-interceptor"
version = "0.1.0"
edition = "2024"
description = "A Windows URL interceptor that can be registered as a default browser candidate."
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6"
floem = "0.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
url = "2"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
